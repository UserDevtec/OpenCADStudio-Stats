name: Update OpenCADStudio download badges

on:
  schedule:
    # GitHub Actions supports scheduled workflows at a minimum interval of 5 minutes.
    # Offset by 2 minutes to avoid the busiest minute of the hour.
    - cron: "2/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: download-stats
  cancel-in-progress: false

jobs:
  update-download-stats:
    runs-on: ubuntu-latest

    env:
      TARGET_REPO: HakanSeven12/OpenCADStudio
      TARGET_TIMEZONE: Europe/Amsterdam

    steps:
      - name: Checkout statistics repository
        uses: actions/checkout@v4

      - name: Update download statistics
        run: python3 scripts/update_download_stats.py

      - name: Commit statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add stats/

          if git diff --cached --quiet; then
            echo "No statistics changed."
            exit 0
          fi

          git commit -m "chore: update download statistics"
          git push
