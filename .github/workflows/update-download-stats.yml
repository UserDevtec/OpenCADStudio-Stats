name: Update OpenCADStudio download growth

on:
  schedule:
    - cron: "2/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: opencadstudio-download-growth
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    env:
      TARGET_REPO: HakanSeven12/OpenCADStudio
      TARGET_TIMEZONE: Europe/Amsterdam

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update download statistics and graphs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_download_stats.py

      - name: Commit updated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add stats/

          if git diff --cached --quiet; then
            echo "No statistics changed."
            exit 0
          fi

          git commit -m "chore: update download growth"
          git push
